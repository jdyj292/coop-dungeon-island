# Nginx 서브도메인 설정 틀 (docs/deploy.md 5장)
# game.example.com 과 인증서 경로를 실제 값으로 바꿔 /etc/nginx/sites-available/ (또는 conf.d/) 에 둔다
# 게임 서버는 127.0.0.1:2567 에서만 듣는다. 페이지·/api·게임 소켓이 모두 이 한 곳으로 간다

# WebSocket 업그레이드 (Upgrade 헤더가 없으면 일반 연결)
map $http_upgrade $coop_connection {
    default upgrade;
    ''      close;
}

upstream coop_game {
    server 127.0.0.1:2567;
    keepalive 16;
}

# http → https
server {
    listen 80;
    listen [::]:80;
    server_name game.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Nginx 1.25.1 미만이면 이 줄을 지우고 위 listen에 http2를 붙인다 (listen 443 ssl http2;)
    http2 on;
    server_name game.example.com;

    # 기존 인증서 (certbot이면 보통 이 경로)
    ssl_certificate     /etc/letsencrypt/live/game.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.example.com/privkey.pem;

    # HSTS (security.md 5장). 나머지 보안 헤더(CSP 등)는 게임 서버가 붙인다
    add_header Strict-Transport-Security "max-age=31536000" always;

    # API 요청은 작은 JSON뿐
    client_max_body_size 64k;

    access_log /var/log/nginx/coop-dungeon-island.access.log;
    error_log  /var/log/nginx/coop-dungeon-island.error.log;

    location / {
        proxy_pass http://coop_game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $coop_connection;
        proxy_set_header Host $host;
        # 실제 접속 IP (서버는 loopback 프록시만 믿음 → 시도 제한·auth_log에 쓰임)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 게임 소켓은 오래 열려 있다
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
