{n:'통통버섯',f:[['대기 1',()=>mush()],['대기 2',()=>mush({sq:1})],['이동 (튀어오름)',()=>mush({st:1}),{dy:-3}],['공격 예고',()=>mush({sq:1,wind:1}),{shake:1}],['들이받기',()=>mush({st:1,lean:1}),{dx:3,fx:(x,X,Y)=>lines(x,X-6,Y-8)}]]},

const RF=ramp('#5F7A47'),RA=ramp('#66824D');
function floorBg(x,w,h,top){x.fillStyle='#26351f';x.fillRect(0,0,w,h);for(let tz=0;tz*10<h-top;tz++)for(let tx=0;tx*16<w;tx++){const R=(tx+tz)%2?RF:RA;for(let y=0;y<10;y++)for(let i=0;i<16;i++){let c=R[1];if(y==0)c=R[0];if(y==9||i==15)c=R[2];if(i==0&&y>0)c=R[0];x.fillStyle=c;x.fillRect(tx*16+i,top+tz*10+y,1,1);}}}
function shadow(x,cx,y,rx){x.fillStyle='rgba(10,14,8,.4)';for(let dy=-2;dy<=1;dy++){const hw=Math.round(rx*Math.sqrt(1-(dy/2.3)**2));x.fillRect(cx-hw,y+dy,hw*2+1,1);}}
const rows=document.getElementById('rows');const SPR=D.map(d=>d.f.map(f=>f[1]()));

const X=Math.floor((LW-spr.width)/2)-(d.big?4:2)+(op.dx||0),Y=GY+(op.dy||0);shadow(ox,X+Math.floor(spr.width/2),GY,Math.max(5,Math.floor(spr.width*.36)));ox.drawImage(spr,X,Y-spr.height+1);if(op.shake){ox.fillStyle='#FFF8E7';ox.fillRect(X-2,Y-8,1,3);ox.fillRect(X+spr.width+1,Y-8,1,3);}if(op.fx)op.fx(ox,X,Y,0.3);

const l=document.createElement('div');l.textContent=f[0];l.style.cssText='font-size:11px;color:#e9f1df;text-align:center;margin-top:2px;line-height:1.3;';card.appendChild(l);row.appendChild(card);});});
const ac=document.getElementById('anim'),AW=240,AH=78,SC=2;ac.width=AW*SC;ac.height=AH*SC;const ax=ac.getContext('2d');ax.imageSmoothingEnabled=false;const o=document.createElement('canvas');o.width=AW;o.height=AH;const g=o.getContext('2d');
const SEQ=[[[0,.4],[1,.4],[0,.4],[2,.25],[3,.6],[4,.35],[1,.5]],[[0,.4],[1,.4],[2,.2],[3,.2],[2,.2],[3,.2],[4,.8],[5,.6],[6,1.0]],[[0,.5],[1,.5],[0,.5],[2,.5],[3,.6],[1,.5]],[[0,.5],[1,.25],[2,.25],[1,.25],[2,.25],[3,1.0],[4,.35],[5,1.0]],[[0,.8],[1,.5],[2,.8],[3,.6],[0,.6],[4,.6],[5,.6],[6,.9],[7,1.4]]];
const POS=[[16,70],[44,70],[76,70],[108,70],[176,72]];let t0=performance.now();
function loop(now){floorBg(g,AW,AH,24);const t=(now-t0)/1000;
SEQ.forEach((sq,mi)=>{const tot=sq.reduce((a,b)=>a+b[1],0);let lt=(t+mi*.3)%tot,fi=sq[0][0];for(const[f,d] of sq){if(lt<d){fi=f;break;}lt-=d;}
const d=D[mi],f=d.f[fi],op=f[2]||{};let spr=SPR[mi][fi];if(mi==4&&fi==5)spr=rot(SPR[4][4],Math.floor(t*8)%4);const [px,gy]=POS[mi];let X=px-Math.floor(spr.width/2)+(op.dx||0),Y=gy+(op.dy||0);if(op.shake)X+=(Math.floor(t*30)%2)?1:-1;

ax.drawImage(o,0,0,AW*SC,AH*SC);requestAnimationFrame(loop);}requestAnimationFrame(loop);
