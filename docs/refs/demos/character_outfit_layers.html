<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>16px 캐릭터 의상 레이어 (확정)</title>
<!-- 대화 중 승인·검토된 원본 데모 (2026-10). 수정 금지. 기준 자료로만 사용 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>:root{--surface-0:#f6f5f1;--surface-1:#f1efe8;--surface-2:#fff;--border:rgba(0,0,0,.15);--border-strong:rgba(0,0,0,.3);--border-accent:#378ADD;--text-primary:#222;--text-secondary:#666;--text-muted:#999;--text-accent:#185FA5;--text-danger:#a32d2d;--bg-accent:#E6F1FB;--radius:8px;--font-mono:monospace}
body{font-family:system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;background:var(--surface-0);color:var(--text-primary)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button{background:transparent;border:1px solid var(--border-strong);border-radius:var(--radius);padding:6px 10px;cursor:pointer}
.t,.th{fill:#222}.ts{fill:#666}</style></head><body>
<h2 class="sr-only">16픽셀 캐릭터에 레이어 방식으로 의상을 갈아입힌 모습: 초보 모험가, 마법사풍, 도적풍, 기사풍, 조합 예시</h2>
<div id="cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;"></div>
<p style="font-size:13px;color:var(--text-secondary);margin:14px 0 6px;">던전 바닥 위 실제 배율 (3배)</p>
<div style="border-radius:var(--border-radius-lg);overflow:hidden;"><canvas id="real" style="width:100%;image-rendering:pixelated;display:block;"></canvas></div>
<script>
const OL='#2A2540';
const h2r=h=>{h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};
function r2hsl(r,g2,b){r/=255;g2/=255;b/=255;const mx=Math.max(r,g2,b),mn=Math.min(r,g2,b);let h=0,s=0,l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g2-b)/d+(g2<b?6:0):mx===g2?(b-r)/d+2:(r-g2)/d+4;h*=60;}return[h,s,l];}
function hsl2h(h,s,l){h=((h%360)+360)%360;s=Math.max(0,Math.min(1,s));l=Math.max(0,Math.min(1,l));const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;let a=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];return'#'+a.map(v=>Math.round((v+m)*255).toString(16).padStart(2,'0')).join('');}
const tw=(h,t,d)=>{const df=((t-h+540)%360)-180;return h+Math.sign(df)*Math.min(Math.abs(df),d);};
function ramp(hex){const[h,s,l]=r2hsl(...h2r(hex));return[hsl2h(tw(h,55,10),s*1.06,l+.11),hex,hsl2h(tw(h,255,14),s*.95,l-.12),hsl2h(tw(h,265,24),s*.9,l-.25)];}
function shadeMask(rows,M,FX){const h=rows.length,w=Math.max(...rows.map(r=>r.length));const c=document.createElement('canvas');c.width=w+2;c.height=h+2;const x=c.getContext('2d');
const get=(i,j)=>(rows[j]&&rows[j][i])||'.',E=ch=>ch==='.';const pos=[];for(let j=0;j<h;j++)pos[j]=[];
for(let i=0;i<w;i++){let j=0;while(j<h){const ch=get(i,j);if(E(ch)){j++;continue;}let k=j;while(k<h&&get(i,k)===ch)k++;for(let q=j;q<k;q++)pos[q][i]=(q-j+.5)/(k-j);j=k;}}
const px=(i,j,col)=>{x.fillStyle=col;x.fillRect(i+1,j+1,1,1);};
for(let j=-1;j<=h;j++)for(let i=-1;i<=w;i++){if(!E(get(i,j)))continue;let col=null;const dn=get(i,j+1),rt=get(i+1,j),up=get(i,j-1),lf=get(i-1,j);
const pick=ch=>FX[ch]?OL:M[ch][3];if(!E(dn))col=pick(dn);else if(!E(rt))col=pick(rt);else if(!E(up))col=OL;else if(!E(lf))col=OL;if(col)px(i,j,col);}
for(let j=0;j<h;j++)for(let i=0;i<w;i++){const ch=get(i,j);if(E(ch))continue;if(FX[ch]){px(i,j,FX[ch]);continue;}
const r=M[ch],up=get(i,j-1),lf=get(i-1,j),dn=get(i,j+1),rt=get(i+1,j),p=pos[j][i];let t=1;
if(p>.72)t=2;if(!E(up)&&up!==ch&&M[up])t=2;
if(E(up)||(E(lf)&&p<.45))t=0;if(E(dn)||(E(rt)&&p>.35))t=Math.max(t,2);if(E(up)&&E(dn))t=1;px(i,j,r[t]);}return c;}
const BASE=["........h...","...hhhhhh...","..hhhhhhhh..",".hhhhhhhhhh.",".hhhhhhshhh.","hhhhsssssss.","hhhsssesses.","hhhsssesses.",".hhssbsssbs.","....ssssss..","..kkkkkkkk..",".ktttttttt..","..stttttts..","...gggggg...","...pp.pp....","...ss.ss....","...fff.fff.."];
const GW=20,GH=22,OX=4,OY=3;
function newGrid(){const g=[...Array(GH)].map(()=>Array(GW).fill('.'));BASE.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch!=='.')g[OY+j][OX+i]=ch;}));return g;}
const set=(g,ch,x,y,w,h,behind)=>{for(let j=y;j<y+(h||1);j++)for(let i=x;i<x+(w||1);i++)if(g[j]&&i>=0&&i<GW&&(!behind||g[j][i]==='.'))g[j][i]=ch;};
const recolor=(g,from,to,y0,y1)=>{for(let j=y0;j<=y1;j++)for(let i=0;i<GW;i++)if(from.includes(g[j][i]))g[j][i]=to;};
const L={
wizHat:g=>{set(g,'.',12,3);set(g,'H',3,6,14);set(g,'y',6,5,8);set(g,'H',6,4,8);set(g,'H',7,3,5);set(g,'H',7,2,4);set(g,'H',6,1,3);set(g,'H',4,0,3);},
wizRobe:g=>{recolor(g,'t','R',14,15);set(g,'y',7,16,6);set(g,'R',6,17,8);set(g,'R',5,18,9);set(g,'.',6,19,1);set(g,'.',10,19,1);},
hood:g=>{set(g,'.',12,3);set(g,'O',7,3,6);set(g,'O',6,4,8);set(g,'O',5,5,10);set(g,'O',4,6,12);set(g,'O',4,7,4);set(g,'O',14,7,2);set(g,'O',3,8,4);set(g,'O',3,9,4);set(g,'O',3,10,4);set(g,'O',4,11,3);set(g,'O',2,6,2);set(g,'O',1,5,2);set(g,'k',8,12,6);},
rogueTop:g=>{recolor(g,'t','V',14,15);set(g,'g',9,16,1);set(g,'P',7,17,2);set(g,'P',10,17,2);recolor(g,'s','P',18,18);recolor(g,'p','P',17,17);},
cape:g=>{[[5,13,2],[3,14,4],[2,15,5],[2,16,5],[1,17,5],[1,18,5],[0,19,5]].forEach(([x,y,w])=>set(g,'C',x,y,w,1,true));},
armor:g=>{recolor(g,'t','A',14,15);set(g,'A',13,13,2);set(g,'A',14,14,1);recolor(g,'p','P',17,17);recolor(g,'s','A',18,18);}};
const OUT=[['초보 모험가','기본 의상',[]],['마법사풍','모자 + 로브',['wizHat','wizRobe']],['도적풍','후드 + 복면 + 가죽옷',['hood','rogueTop']],['기사풍','갑옷 + 망토',['cape','armor']],['조합 예시','마법사 모자 + 기사 갑옷·망토',['cape','armor','wizHat']]];
function build(layers,scarf){const g=newGrid();layers.forEach(k=>L[k](g));
const M={h:ramp('#7A4E36'),s:ramp('#F6DCC0'),t:ramp('#C9734B'),g:ramp('#8a5a36'),p:ramp('#6B5444'),f:ramp('#5A4636'),k:ramp(scarf),H:ramp('#5D63B8'),R:ramp('#5D63B8'),y:ramp('#F5C542'),O:ramp('#3F7F86'),V:ramp('#4A4558'),P:ramp('#3E3B4E'),A:ramp('#B8C2CC'),C:ramp('#4F6FB0')};
return shadeMask(g.map(r=>r.join('')),M,{e:OL,b:'#F2A08F',m:'#B5555A'});}
const cards=document.getElementById('cards');
OUT.forEach(([n,d,ls])=>{const spr=build(ls,'#6FC3E8');const sc=6,W2=spr.width,H2=spr.height+2;const o=document.createElement('canvas');o.width=W2;o.height=H2;const ox=o.getContext('2d');
ox.fillStyle='rgba(10,14,8,.35)';ox.fillRect(OX+2,H2-3,10,1);ox.fillRect(OX+3,H2-2,8,1);ox.drawImage(spr,0,0);
const card=document.createElement('div');card.style.cssText='background:#2b3a24;border-radius:var(--border-radius-lg);padding:8px;';
const c=document.createElement('canvas');c.width=W2*sc;c.height=H2*sc;c.style.cssText='width:100%;image-rendering:pixelated;display:block;';const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(o,0,0,W2*sc,H2*sc);card.appendChild(c);
const t=document.createElement('p');t.textContent=n;t.style.cssText='font-size:14px;font-weight:500;margin:6px 0 2px;color:#e9f1df;';card.appendChild(t);
const dd=document.createElement('p');dd.textContent=d;dd.style.cssText='font-size:12px;color:#b9c7ad;margin:0;line-height:1.4;';card.appendChild(dd);cards.appendChild(card);});
const rc=document.getElementById('real'),LW=150,LH=40,SC=3;rc.width=LW*SC;rc.height=LH*SC;const o=document.createElement('canvas');o.width=LW;o.height=LH;const g=o.getContext('2d');
const RF=ramp('#5F7A47'),RA=ramp('#66824D'),RW=ramp('#3E5434');
for(let x=0;x<LW;x++)for(let y=0;y<12;y++){const by=y%7,bx=(x+(Math.floor(y/7)%2?8:0))%16;let c=RW[1];if(by==6||bx==0)c=RW[3];else if(by==0)c=RW[0];else if(by==5||bx==15)c=RW[2];if(y>8)c=(x+y)%2?RW[3]:RW[2];g.fillStyle=c;g.fillRect(x,y,1,1);}
for(let tz=0;tz<3;tz++)for(let tx=0;tx<10;tx++){const R=(tx+tz)%2?RF:RA;for(let y=0;y<10;y++)for(let x=0;x<16;x++){let c=R[1];if(y==0)c=R[0];if(y==9||x==15)c=R[2];if(x==0&&y>0)c=R[0];g.fillStyle=c;g.fillRect(tx*16+x,12+tz*10+y,1,1);}}
for(let x=0;x<LW;x++)for(let y=12;y<18;y++)if((x+y)%2==0&&y<15||(x%2==0&&y%2==0)){g.fillStyle='rgba(20,28,16,.5)';g.fillRect(x,y,1,1);}
function put(spr,cx,fy){g.fillStyle='rgba(10,14,8,.4)';g.fillRect(cx-4,fy,9,1);g.fillRect(cx-5,fy-1,11,1);g.drawImage(spr,cx-(OX+7),fy-(OY+17));}
put(build([],'#6FC3E8'),18,33);put(build(['wizHat','wizRobe'],'#F2C94C'),46,30);put(build(['hood','rogueTop'],'#8FD16A'),76,34);put(build(['cape','armor'],'#F28DB2'),106,31);put(build(['cape','armor','wizHat'],'#6FC3E8'),134,33);
const x=rc.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(o,0,0,LW*SC,LH*SC);
</script>
</body></html>
